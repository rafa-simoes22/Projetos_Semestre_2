<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estruturas de decisão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
    <script src="script.js"></script>
    <script>
        const executar = () => {
            const x = eval(document.getElementById("v1").value);
            let serie = "", i=0;

            while(i<x){
                serie += fibonacci(i) + ""; 
                i++;
            }
            document.getElementById("resp").innerHTML = `Resultado: ${serie}`;
        }
    </script>
</head>
<body class="container">
    <h1>Série de Fibonacci</h1>
    <form class="form m-2">
        <label class="form-label">Digite um valor</label>
        <input class="form-control" type="number" id="v1">

        <a class="btn btn-primary m-2" href="#" onclick="executar()">Executar</a>
    </form>

    <div class="alert alert-success" id="resp">Resultado:</div>
</body>
</html>
