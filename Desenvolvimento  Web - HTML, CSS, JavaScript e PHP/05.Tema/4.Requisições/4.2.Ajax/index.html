<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ajax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
    <script src="script.js"></script>
    <script>
        const executar = () => {
            const nome = document.getElementById("n1").value;
            ajax(nome, "retorno");
        }
    </script>
</head>
<body class="container">
    <h1>API de Testes HTTPbin</h1>
    <form class="form m-2">
        <label class="form-label">Nome</label>
        <input class="form-control" type="text" id="n1">
        <a class="btn btn-primary m-2" href="#" onclick="executar()">Executar</a>
    </form>
    <div class="alert alert-warning" id="retorno"></div>
</body>
</html>
