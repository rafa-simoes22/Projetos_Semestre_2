<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
    <script src="script.js"></script>
    <script>
        const executar = () => {
            const a = Number(document.getElementById("v1").value);
            const b = Number(document.getElementById("v2").value);
            let oper = document.getElementById("oper").selectedIndex;
            
            let resultado = (oper==0)?somar(a,b):(oper==1)?subtrair(a,b):
            (oper==2)?multiplicar(a,b):(oper==3)?dividir(a,b):exponencial(a,b);

            document.getElementById("resp").innerHTML = `Resultado da operação: ${resultado}`;
        }
    </script>
    <title>Calculadora</title>
</head>
<body class="container">
    <form class="form m-2">
        <label class="form-label">Valor A</label>
        <input class="form-control" type="number" id="v1">

        <label class="form-label">Valor B</label>
        <input class="form-control" type="number" id="v2">

        <label class="form-label">Operaçaõ</label>
        <select class="form-select" id="oper">
            <option value="somar">Soma</option>
            <option value="subtrair">Subtração</option>
            <option value="multiplicar">Multiplicação</option>
            <option value="dividir">Divisão</option>
            <option value="exponencial">Potencia</option>
        </select>

        <a href="#" class="btn btn-primary m-2" onclick="executar()">Executar</a>
    </form>

    <div class="alert alert-success" id="resp">Resultado</div>
</body>
</html>
